name: Update Gacha Events

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper (HSR + ZZZ)
        run: python scraper.py

      - name: Guardar events.json si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --staged --quiet; then
            echo "Sin cambios en events.json"
          else
            git commit -m "Actualizar eventos automáticamente"
            git push
          fi
